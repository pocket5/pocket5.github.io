  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

      <!-- Left: details -->
      <section class="col-lg-5 info d-flex flex-column justify-content-between gap-5 pt-4 pb-5 py-lg-5 ps-4 pe-4 pe-lg-5">
        <a href="#" class="logo align-self-start text-decoration-none">
            <img src="img/logo.png" alt="pocket5" class="d-block">
        </a>

        <div>
          <h1 class="headline fw-medium">Merch you’ll actually <i class="accent-text">want</i>&nbsp; to wear.</h1>
          <p class="tagline mt-3 fs-5">Original merch + custom merch design for people, brands and occasions.</p>

          <div class="d-grid gap-3 mt-4 actions">
            <a href="https://pocket5.vendblue.store/products" class="btn btn-lg rounded-pill btn-blue" target="_blank" rel="noopener">
              Shop POCKET5
            </a>
            <a href="mailto:hellopocketfive@gmail.com?subject=Custom%20Design%20Request" class="btn btn-lg rounded-pill btn-ink">
              Request a Custom Design
            </a>
          </div>
        </div>

        <nav class="socials d-flex flex-wrap gap-4 pb-4" aria-label="Social links">
          <a href="https://www.instagram.com/pocket5.co" target="_blank" rel="noopener" class="text-decoration-none">
            <i class="fa-brands fa-instagram me-2"></i>Instagram
          </a>
          <a href="https://tiktok.com/@pocket5.co" target="_blank" rel="noopener" class="text-decoration-none">
            <i class="fa-brands fa-tiktok me-2"></i>TikTok
          </a>
          <a href="https://facebook.com/pocket5.co" target="_blank" rel="noopener" class="text-decoration-none">
            <i class="fa-brands fa-facebook me-2"></i>Facebook
          </a>
          <a href="https://pin.it/3K24O7R1D" target="_blank" rel="noopener" class="text-decoration-none">
            <i class="fa-brands fa-pinterest me-2"></i>Pinterest
          </a>
        </nav>
      </section>

      <!-- Right: slideshow -->
      <section class="col-lg-7 show">
        <div id="showCarousel" class="carousel slide carousel-fade" aria-label="POCKET5 designs">
          <div class="carousel-indicators"></div>
          <div class="carousel-inner"></div>
          <div class="arrows d-flex gap-2">
            <button class="btn btn-light rounded-circle" type="button" data-bs-target="#showCarousel" data-bs-slide="prev" aria-label="Previous slide">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="btn btn-light rounded-circle" type="button" data-bs-target="#showCarousel" data-bs-slide="next" aria-label="Next slide">
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
        <p class="empty d-none text-center m-0 p-4">Add your images to the img folder as slide-1.jpg, slide-2.jpg and so on.</p>
      </section>

    </div>
  </main>

  <script src="https://kit.fontawesome.com/4f82f7d87a.js" crossorigin="anonymous"></script>
